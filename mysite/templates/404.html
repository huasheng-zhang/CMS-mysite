{% extends "base.html" %}

{% block title %}页面未找到 - CMS新闻管理系统{% endblock %}

{% block body_class %}template-404{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .error-code {
        font-size: 8rem;
        font-weight: 800;
        color: #2563eb;
        line-height: 1;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">404</div>
        <h2 class="mt-3">抱歉，页面未找到</h2>
        <p class="text-muted mt-2 mb-4">您访问的页面不存在或已被移除。</p>
        <a href="/news/" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> 返回首页
        </a>
    </div>
</div>
{% endblock %}
